<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamSpace - Home</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">StreamSpace</a>
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Search videos..." />
      <select id="categoryFilter">
        <option value="all">All Categories</option>
      </select>
    </div>
    <nav>
      <a href="upload.html">Upload</a>
      <a href="profile.html">Profile</a>
      <a href="login.html" id="authLink">Login</a>
    </nav>
  </header>

  <main class="layout">
    <section>
      <h2>Browse Videos</h2>
      <div id="videoGrid" class="video-grid"></div>
    </section>

    <aside>
      <h3>Recommended for You</h3>
      <div id="recommendations" class="stack"></div>
      <h3>Subscription</h3>
      <div class="card paywall">
        <p id="tierLabel">Current tier: Free</p>
        <a href="profile.html" class="button">Upgrade</a>
      </div>
    </aside>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/videos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
