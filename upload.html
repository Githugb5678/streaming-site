<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamSpace - Upload</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">StreamSpace</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <main class="layout">
    <section class="card">
      <h2>Upload Video (Simulation)</h2>
      <form id="uploadForm" class="stack">
        <input id="uploadTitle" type="text" placeholder="Video title" required />
        <input id="uploadCategory" type="text" placeholder="Category" required />
        <input id="uploadDuration" type="text" placeholder="Duration (e.g., 10:12)" required />
        <input id="uploadFile" type="file" accept="video/*" required />
        <button class="button" type="submit">Start Upload</button>
      </form>
      <div id="uploadStatus"></div>
      <div class="progress">
        <div id="uploadProgress"></div>
      </div>
    </section>

    <section class="card">
      <h3>Your Uploaded Videos</h3>
      <div id="uploadsList" class="stack"></div>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/videos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
